name: Publish Docker image
on:
    push:
        branches: [main, feature/cloudflared]
jobs:
    push_to_registry:
        name: Push Docker image to Docker Hub
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to docker hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Generate Docker tags
              id: tag
              run: |
                  TS=$(date +%Y%m%d%H%M)
                  case "${{ github.ref_name }}" in
                      main) PREFIX="" ;;
                      feature/cloudflared) PREFIX="cloudflared-" ;;
                      *) PREFIX="${{ github.ref_name }}-" ;;
                  esac
                  IMG="${{ secrets.DOCKERHUB_USERNAME }}/m3u8-proxy-impersonate"
                  echo "tags=$IMG:${PREFIX}$TS,$IMG:${PREFIX}latest" >> "$GITHUB_OUTPUT"
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  push: true
                  tags: ${{ steps.tag.outputs.tags }}
                  platforms: linux/amd64,linux/arm64

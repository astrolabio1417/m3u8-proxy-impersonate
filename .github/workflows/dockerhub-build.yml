name: Publish Docker image
on:
    push:
        branches: [main, feature/cloudflared]
env:
    IMG: ${{ secrets.DOCKERHUB_USERNAME }}/m3u8-proxy-impersonate
jobs:
    build:
        name: Build ${{ matrix.arch }}
        strategy:
            matrix:
                include:
                    - runner: ubuntu-latest
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  platforms: linux/${{ matrix.arch }}
                  outputs: type=image,name=${{ env.IMG }},push-by-digest=true,name-canonical=true,push=true
            - name: Export digest
              run: |
                  mkdir -p digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "digests/${digest#sha256:}"
            - uses: actions/upload-artifact@v4
              with:
                  name: digest-${{ matrix.arch }}
                  path: digests/*
                  if-no-files-found: error
    merge:
        name: Push manifest
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: digests
                  pattern: digest-*
                  merge-multiple: true
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Create manifest and push
              run: |
                  TS=$(date +%Y%m%d%H%M)
                  case "${{ github.ref_name }}" in
                      main) PREFIX="" ;;
                      feature/cloudflared) PREFIX="cloudflared-" ;;
                      *) PREFIX="${{ github.ref_name }}-" ;;
                  esac
                  docker buildx imagetools create -t "$IMG:${PREFIX}$TS" -t "$IMG:${PREFIX}latest" \
                      $(printf "$IMG@sha256:%s " $(ls digests))
